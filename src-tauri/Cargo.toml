[package]
name = "mentinote"
version = "0.6.7"
description = "A local Markdown-first knowledge workspace for notes and tasks using backlinks as semantic tags."
authors = ["Jens"]
license = "AGPL-3.0-only"
repository = "https://github.com/SphericalCow1/mentiNote"
homepage = "https://github.com/SphericalCow1/mentiNote"
readme = "../README.md"
edition = "2021"
default-run = "mentiNote"
autobins = false

[[bin]]
name = "mentiNote"
path = "src/main.rs"

[lib]
name = "mentinote_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
notify = "8"
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = false
strip = "symbols"
