name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' package.json | head -1)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --target "${{ github.sha }}" --title "mentiNote v$version" --notes "Windows installer, portable Windows executable, macOS app zip, and Linux packages."

  publish-tauri:
    permissions:
      contents: write

    needs: create-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
            kind: windows
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app"
            kind: macos
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"
            kind: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.kind == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test frontend
        run: npm run test:frontend

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload Windows assets
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $tag = "${{ needs.create-release.outputs.tag }}"
          $assetName = "mentiNote_${version}_x64.exe"

          Copy-Item "src-tauri/target/release/mentiNote.exe" $assetName
          gh release upload $tag $assetName --clobber

          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }

      - name: Upload macOS app zip
        if: matrix.kind == 'macos'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.create-release.outputs.version }}"
          tag="${{ needs.create-release.outputs.tag }}"
          app_path=$(find src-tauri/target -type d -name "mentiNote.app" | head -1)
          asset_name="mentiNote_${version}_universal.app.zip"

          ditto -c -k --keepParent "$app_path" "$asset_name"
          gh release upload "$tag" "$asset_name" --clobber

      - name: Upload Linux packages
        if: matrix.kind == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"

          find src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" \) -print0 |
            xargs -0 -I {} gh release upload "$tag" "{}" --clobber
