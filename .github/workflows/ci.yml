name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"
      - "docs/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: ci-quality
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test frontend
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Test Rust core
        working-directory: src-tauri
        run: cargo test --locked

  build:
    name: ci-build-${{ matrix.kind }}
    needs: quality
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            kind: windows
            bundle_args: "--bundles nsis"
          - platform: macos-latest
            kind: macos
            bundle_args: "--bundles app"
          - platform: ubuntu-22.04
            kind: linux
            bundle_args: "--bundles appimage"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri application
        run: npm run tauri build -- ${{ matrix.bundle_args }}

      - name: Stage Windows artifacts
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          Copy-Item "src-tauri/target/release/Logtext.exe" "ci-artifacts/Logtext_windows_${{ runner.arch }}.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" ci-artifacts/

      - name: Stage macOS artifact
        if: matrix.kind == 'macos'
        run: |
          mkdir -p ci-artifacts
          app_path=$(find src-tauri/target -type d -name "Logtext.app" | head -1)
          test -n "$app_path"
          ditto -c -k --keepParent "$app_path" "ci-artifacts/Logtext_macos_${{ runner.arch }}.app.zip"

      - name: Stage Linux artifact
        if: matrix.kind == 'linux'
        run: |
          mkdir -p ci-artifacts
          tar -czf "ci-artifacts/Logtext_linux_${{ runner.arch }}.tar.gz" -C src-tauri/target/release/bundle/appimage .

      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Logtext-${{ matrix.kind }}-${{ github.sha }}
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 7
